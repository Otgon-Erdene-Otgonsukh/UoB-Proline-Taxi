# A simple integration workflow that is triggered on PR and push to main and dev that runs jest tests and linting.
name: Build & Test

# Controls when the workflow will run
on:
  push:
    branches: ["dev", "main"]
  pull_request:
    branches: ["dev", "main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup node to run npm commands
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install Dependencies
        working-directory: ./uob_transport_app
        run: npm ci # clean install from package.lock.json

      - name: Generate Prisma Client
        working-directory: ./uob_transport_app
        run: npx prisma generate # the db queries requires a client
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Run linting
        working-directory: ./uob_transport_app
        run: npm run lint

      - name: Run typescript compiler for type errors
        working-directory: ./uob_transport_app
        run: npx tsc --noEmit # just check for type errors, --noEmit flag prevents tsc from creating .js files

      - name: Run Jest tests
        working-directory: ./uob_transport_app
        run: npm test

      - name: Build the next.js app # Make sure the project builds and compiles correctly
        working-directory: ./uob_transport_app
        run: npm run build
